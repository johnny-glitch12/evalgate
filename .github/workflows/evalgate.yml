name: eval gate

on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (no services, so they cannot skip to green)
        run: |
          pip install pytest
          pytest tests/ -q
      - name: Eval regression gate vs committed baseline
        run: python3 -m evalgate.run
